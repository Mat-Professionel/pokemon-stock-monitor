name: Surveillance Pokémon 30 ans

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Envoyer uniquement un message de test Telegram"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: pokemon-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Mettre en cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Installer Chromium
        run: python -m playwright install --with-deps chromium

      - name: Vérifier les produits
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.telegram_test }}" = "true" ]; then
            python monitor.py --test-telegram
          else
            python monitor.py --once
          fi

      - name: Sauvegarder le nouvel état
        if: ${{ inputs.telegram_test != true }}
        run: |
          if git diff --quiet -- state.json; then
            echo "Aucun changement d'état"
            exit 0
          fi
          git config user.name "pokemon-stock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update stock state [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
